<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Immich Albums Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        input {
            padding: 6px;
            margin: 5px 0;
            width: 400px;
        }

        button {
            padding: 8px 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        .album {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
        }

        .album-thumbnail {
            max-width: 200px;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 4px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<h1>Immich Albums Viewer</h1>

<div>
    <label>API Key:</label><br>
    <input id="api_key" type="text" placeholder="Enter your Immich API key" value="{{ immich_api_key }}">
</div>

<button onclick="loadAlbums()">Load Albums</button>
<button onclick="createImmichConfiguration()">Update ImmichFrame Config</button>

<hr>

<h2>Albums</h2>
<div id="status"></div>
<div id="albums"></div>

<script>

const serverUrl ="{{ immich_server_url }}";

async function loadAlbums() {
    const apiKey = document.getElementById("api_key").value;
    const status = document.getElementById("status");
    const albumsDiv = document.getElementById("albums");

    status.innerHTML = "Loading...";
    albumsDiv.innerHTML = "";

    try {
        const res = await fetch("/api/albums", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                server_url: serverUrl,
                api_key: apiKey
            })
        });

        if (!res.ok) {
            const text = await res.text();
            throw new Error(text);
        }

        const albums = await res.json();

        if (!Array.isArray(albums)) {
            throw new Error("Invalid response from server");
        }

        status.innerHTML = `Loaded ${albums.length} albums`;

        albums.forEach(album => {
            const div = document.createElement("div");
            div.className = "album";

            const checkboxId = `album-checkbox-${album.id}`;
            let thumbnailHtml = "";
            if (album.albumThumbnailAssetId) {
                thumbnailHtml = `<br><img alt="Album thumbnail" class="album-thumbnail" data-asset-id="${album.albumThumbnailAssetId}">`;
            }

            div.innerHTML = `
                <label for="${checkboxId}">
                    <input type="checkbox" id="${checkboxId}" data-album-id="${album.id}">
                    <strong>${album.albumName || "No name"}</strong>
                </label><br>
                ID: ${album.id}<br>
                Assets: ${album.assetCount || 0}${thumbnailHtml}
            `;

            albumsDiv.appendChild(div);

            const thumbnail = div.querySelector(".album-thumbnail");
            if (thumbnail) {
                loadThumbnail(thumbnail, apiKey, album.albumThumbnailAssetId);
            }
        });

    } catch (err) {
        status.innerHTML = `<div class="error">Error: ${err.message}</div>`;
    }
}

async function loadThumbnail(image, apiKey, assetId) {
    try {
        const res = await fetch("/api/thumbnail", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                server_url: serverUrl,
                api_key: apiKey,
                asset_id: assetId
            })
        });

        if (!res.ok) {
            image.remove();
            return;
        }

        const thumbnail = await res.blob();
        image.src = URL.createObjectURL(thumbnail);
    } catch (err) {
        image.remove();
    }
}

async function createImmichConfiguration() {
    const apiKey = document.getElementById("api_key").value;
    const status = document.getElementById("status");

    const selectedCheckboxes = Array.from(document.querySelectorAll("#albums input[type=checkbox]:checked"));
    const albumIds = selectedCheckboxes.map(cb => cb.dataset.albumId).filter(Boolean);

    if (!apiKey) {
        status.innerHTML = `<div class="error">API key is required.</div>`;
        return;
    }

    status.innerHTML = "Updating ImmichFrame configuration...";

    try {
        const res = await fetch("/create-immich-configuration", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                server_url: serverUrl,
                api_key: apiKey,
                album_ids: albumIds
            })
        });

        const result = await res.json();

        if (!res.ok) {
            throw new Error(result.error || JSON.stringify(result));
        }

        status.innerHTML = `ImmichFrame config updated successfully.<br>${result.message || "Done."}`;
    } catch (err) {
        status.innerHTML = `<div class="error">Error: ${err.message}</div>`;
    }
}
</script>

</body>
</html>
