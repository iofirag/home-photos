name: client-stack

services:

  redis:
    image: docker.io/redis:7-alpine
    container_name: immich_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ./client-data/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: ${IMMICH_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
      TZ: ${TZ}
      IMMICH_TELEMETRY_INCLUDE: all
      IMMICH_EXTERNAL_URL: https://photos-${DEVICE_ID}.${BASE_DOMAIN}
    volumes:
      - ./client-data/immich/upload:/usr/src/app/upload
      # - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      disable: false

  immichframe:
    image: ghcr.io/immichframe/immichframe:latest
    container_name: ${IMMICHFRAME_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    # environment:
      # ImmichServerUrl: http://immich-server:2283
      # IMMICHFRAME_CONFIG_PATH: /app/Config
    volumes:
      - ./client-data/immichframe/Config:/app/Config:ro
    ports:
      - "8080:8080"
    depends_on:
      - ${IMMICH_CONTAINER_NAME}

  immichframe-manager:
    container_name: immichframe-manager
    image: immich_frame_manager:latest
    pull_policy: never
    build:
      context: ./ImmichFrame-Manager
    restart: unless-stopped
    depends_on:
      - immichframe
    ports:
      - "8081:8099"
    volumes:
      - ./client-data/immichframe/Config:/config
      - ./client-data/immichframe-manager-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Jerusalem
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: 1234
      SETTINGS_FILE: /config/Settings.yml
      STATE_FILE: /data/state.yaml
      IMMICHFRAME_CONTAINER: immichframe
      ENABLE_DOCKER_RESTART: "true"
      SYNC_INTERVAL_SECONDS: "300"
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "8099"